<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Foldlight · 玻璃效果对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1080px;margin:auto;padding:40px 24px}header p{color:#737379;line-height:1.6}h1{font-size:34px;letter-spacing:-1px;margin:10px 0}small{letter-spacing:.12em;color:#737379}.controls{position:sticky;top:0;z-index:1;display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:#f5f5f7ee;padding:18px 0;backdrop-filter:blur(20px)}label{display:flex;gap:10px;align-items:center}input{accent-color:#007aff}button{border:0;background:#007aff;color:white;padding:12px 20px;border-radius:24px;font:inherit}section{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}.card{background:white;border-radius:24px;padding:24px}.card h2{font-size:18px;margin:0 0 6px}.card p{font-size:13px;color:#737379;margin:0 0 20px}.display{display:flex;justify-content:center;background:#e9e9ed;padding:18px;border-radius:16px}canvas{width:100%;height:auto;display:block;background:black;border-radius:14px}.cover canvas{max-width:200px;aspect-ratio:1248/1972}.inner canvas{aspect-ratio:2448/1848}footer{color:#737379;font-size:12px;line-height:1.6;margin-top:20px}@media(max-width:650px){main{padding:24px 12px}section{gap:10px}.card{padding:12px;border-radius:16px}.display{padding:8px}.card h2{font-size:16px}.controls{gap:12px}h1{font-size:28px}}
</style><main><header><small>FOLDLIGHT · RENDER STUDY</small><h1>画面，留在玻璃之后。</h1><p>同一张图片，同一个角度。左列为现有效果，右列为参考玻璃。<br>直接运行 Android 的片元着色器；这里用简化角度曲线预览，实际跟随以手机体验为准。</p></header>
<div class="controls"><button id="play">播放开合</button><label>展开角度 <input id="angle" type="range" min="0" max="180" value="60"><output id="degrees">60°</output></label><label>外屏右侧压缩 <input id="compression" type="range" min="0" max="100" value="100"><output id="compression-value">100%</output></label><label>磨砂 <input id="frost" type="range" min="0" max="100" value="20"><output id="percent">20%</output></label></div>
<section><article class="card"><h2>外屏 · 原效果</h2><p>图片翻折、收缩与渐黑</p><div class="display cover"><canvas id="cover-old" width="384" height="607"></canvas></div></article><article class="card"><h2>外屏 · 参考玻璃</h2><p>视差、连续磨砂与完整明暗</p><div class="display cover"><canvas id="cover-new" width="384" height="607"></canvas></div></article><article class="card"><h2>内屏 · 原效果</h2><p>左侧收缩，右侧固定</p><div class="display inner"><canvas id="inner-old" width="640" height="483"></canvas></div></article><article class="card"><h2>内屏 · 参考玻璃</h2><p>左侧逐渐对焦，右侧固定</p><div class="display inner"><canvas id="inner-new" width="640" height="483"></canvas></div></article></section><footer>本地实验预览 · 原创示意图 · 未修改线上网站。参考效果独立实现，未包含参考站的模型、图片或视频。<p id="status">正在准备玻璃纹理…</p></footer></main>
<script type="module">
import {GlassBlur} from './glass-blur.js';
const fragment=await(await fetch('fragment.glsl')).text(),image=new Image();image.src='demo-screen.svg';await image.decode();
function setup(canvas,cover,reference){
 const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});if(!gl)throw Error('WebGL2 unavailable');
 const program=gl.createProgram();for(const [type,code] of [[gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0,1);}'],[gl.FRAGMENT_SHADER,fragment]]){const s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));gl.attachShader(program,s)}gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);for(const [p,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,p,v);gl.generateMipmap(gl.TEXTURE_2D);const blur=new GlassBlur(gl),soft=blur.build(texture,image.width,image.height);
 const u=name=>gl.getUniformLocation(program,name),f=(n,v)=>gl.uniform1f(u(n),v),i=(n,v)=>gl.uniform1i(u(n),v),v=(n,a,b)=>gl.uniform2f(u(n),a,b);
 function draw(degrees,frost,override={}){const p=degrees/180,w=canvas.width,h=canvas.height;gl.useProgram(program);gl.viewport(0,0,w,h);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,soft);i('photo',0);i('glassPhoto',1);v('size',w,h);v('viewport',w,h);v('imageSize',image.width,image.height);let aspect=w/h,ia=image.width/image.height;v('uvScale',Math.min(1,aspect/ia),Math.min(1,ia/aspect));i('rotation',0);i('horizontal',0);i('moveRight',+cover);i('isCover',+cover);i('innerReveal',1);i('referenceGlass',+reference);f('opening',p);f('edgeDeformation',+document.querySelector('#compression').value/100);f('crease',cover?0:.5);f('frost',frost);f('frostGradient',1);f('glassSigma',blur.baseSigma);
 const tilt=cover?100*(p+2.2*p*(1-p)**8):76.5*Math.tanh(.9*90/85*(1-p))/Math.tanh(.9*90/85);
 f('tilt',tilt*Math.PI/180);const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};f('brightness',1-smooth((degrees-85)/95));f('innerProgress',Math.max(0,Math.min(1,(degrees-90)/90)));for(const[n,value]of Object.entries(override))f(n,value);gl.drawArrays(gl.TRIANGLES,0,3);if(gl.getError())throw Error('GL error');}
 return {draw,pixels(){const pixels=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);return pixels},canvas};
}
const scenes=[...document.querySelectorAll('canvas')].map(c=>setup(c,c.id.startsWith('cover'),c.id.endsWith('new')));let animation=0,start=0;
function render(){const a=+document.querySelector('#angle').value,f=+document.querySelector('#frost').value;document.querySelector('#degrees').value=a+'°';document.querySelector('#percent').value=f+'%';document.querySelector('#compression-value').value=document.querySelector('#compression').value+'%';scenes.forEach(s=>s.draw(a,f/100))}
for(const id of ['angle','frost','compression'])document.getElementById(id).oninput=()=>{cancelAnimationFrame(animation);animation=0;document.querySelector('#play').textContent='播放开合';render()};
document.querySelector('#play').onclick=()=>{if(animation){cancelAnimationFrame(animation);animation=0;document.querySelector('#play').textContent='播放开合';return}start=performance.now();document.querySelector('#play').textContent='暂停';function tick(t){document.querySelector('#angle').value=Math.round(90-90*Math.cos((t-start)/3000*Math.PI));render();animation=requestAnimationFrame(tick)}animation=requestAnimationFrame(tick)};
window.study={scenes,render};render();document.querySelector('#status').textContent='四组着色器已编译，纹理已就绪。';
</script></html>
