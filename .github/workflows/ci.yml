name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm run check:public
      - run: npm test && npm run build
      - run: python -m pip install -r analytics/requirements.lock
      - run: python -m unittest discover -s analytics/tests -v
      - run: python -m unittest discover -s android/tools -p 'test_*.py'
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./android/gradlew -p android testDebugUnitTest lintDebug assembleDebug
  apple-builds:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./macos/build.sh
      - name: iPhone Simulator build (no signing)
        run: >-
          xcodebuild -project DuoLikeAnimation.xcodeproj -scheme Foldlight
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/iOS CODE_SIGNING_ALLOWED=NO build
