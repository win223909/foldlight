name: Feature request / 功能建议
description: Suggest a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve? / 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior / 期望的功能
    validations:
      required: true
